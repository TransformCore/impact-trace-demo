name: Publish ImpactTrace PR comment

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  actions: read
  contents: read
  pull-requests: write

jobs:
  comment:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Download comment from the CI run
        uses: actions/download-artifact@v4
        with:
          name: impact-trace-pr-comment
          path: impact-trace-comment
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Create the PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const body = fs.readFileSync('impact-trace-comment/pr-comment.md', 'utf8');
            const issue_number = Number(
              fs.readFileSync('impact-trace-comment/pr-number.txt', 'utf8').trim()
            );

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              body,
            });
